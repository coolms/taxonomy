name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency or a PHP point release shows up on a
  # Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # --prefer-lowest is not padding. The constraints in composer.json are
        # a promise about what this works with, and the only way that promise
        # gets tested is by installing the floor of every range. Without it a
        # constraint can drift years below what the code actually needs and
        # nobody finds out until a consumer with an older lock installs it.
        deps: ['highest', 'lowest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # Everything up to xmlwriter is PHPUnit's, from its composer.json
          # plus what its bootstrap checks at runtime; ctype and tokenizer are
          # runtime-only, so a list built from `require` alone installs fine
          # and then refuses to run. curl and phar are Composer's.
          extensions: none, ctype, dom, filter, json, libxml, mbstring, tokenizer, xml, xmlwriter, curl, phar

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      # No composer.lock here (it's a library), so this resolves fresh every
      # run and catches a dependency drifting out from under the constraints.
      #
      # The platform siblings ship in LOCKSTEP with this package, so their
      # published tag and this branch are only ever out of step inside the
      # settling window -- which is exactly where CI lives. Pin them to the
      # generation branch so the resolve sees the code this branch was written
      # against. Never in the published manifest, and after
      # `composer validate --strict` above has already seen the real one.
      #
      # Relaxing stability is NOT enough on its own once the generation has an
      # alpha tag: prefer-stable ranks alpha above dev, so v2.0.0-alphaN starts
      # winning over dev-develop and the hatch closes silently -- the install
      # succeeds against a sibling that no longer has the classes this branch
      # imports.
      #
      # Scoped deliberately. coolms/rql is an INDEPENDENT library on its own
      # major, so its published tag is the right thing to test against and
      # --prefer-lowest goes on doing its real job on that floor.
      - name: Resolve the platform siblings from the generation branch
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          # A new coolms dependency has to be classified before it can be
          # resolved, so this list cannot go stale without the build saying so.
          php -r '
            $d = json_decode(file_get_contents("composer.json"), true);
            $known = ["coolms/core", "coolms/entity", "coolms/rql"];
            $seen = array_merge(array_keys($d["require"] ?? []),
                                array_keys($d["require-dev"] ?? []));
            $new = array_diff(array_filter($seen,
                static fn ($p) => str_starts_with($p, "coolms/")), $known);
            if ($new) {
                fwrite(STDERR, "unclassified coolms dependency -- classify it in "
                    . "this workflow before it can be resolved: "
                    . implode(", ", $new) . PHP_EOL);
                exit(1);
            }
          '

      - name: Install dependencies
        run: |
          WITH='--with coolms/core:2.0.x-dev'
          WITH="$WITH --with coolms/entity:2.0.x-dev"
          if [ "${{ matrix.deps }}" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress $WITH
          else
            composer update --prefer-dist --no-interaction --no-progress $WITH
          fi

      - name: Lint sources
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: |
          # There are no tests in this package yet, so `tests/` is not in the
          # repository at all and phpunit exits 2 on the missing directory.
          # Failing a build for the absence of something nobody has written is
          # noise; saying so in the log is not. This condition stops being true
          # the moment the first test lands, and then they run.
          if [ -z "$(find tests -name '*Test.php' 2>/dev/null)" ]; then
              echo 'no tests in this package yet -- nothing was run'
              exit 0
          fi
          vendor/bin/phpunit --testdox


  boundary:
    name: No application code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This package was extracted out of an application, and the whole point
      # of the extraction was that it stops depending on one. Asserted rather
      # than trusted, because a single `use App\...` added later would compile
      # fine here and break only for consumers.
      - name: Assert nothing references an application namespace
        run: |
          if grep -rnE '\bApp\\+[A-Z]' src/ ; then
            echo "::error::src/ references an application namespace"
            exit 1
          fi
          echo "confirmed: no application namespace in src/"

      # The domain package carries NO persistence import at all -- that rule is
      # stricter here than for the family's other members, and it is the reason
      # the mapping lives in coolms/taxonomy-doctrine as XML. Doctrine's
      # Collections is a data structure and is allowed; the ORM and DBAL are not.
      - name: Assert the domain imports no ORM
        run: |
          if grep -rnE 'Doctrine\\+(ORM|DBAL)\\+' src/ ; then
            echo "::error::the domain package imports the ORM"
            exit 1
          fi
          echo "confirmed: no Doctrine ORM or DBAL import in src/"
